name: temp fetch jsQR
on:
  push:
    paths:
      - '.github/workflows/temp-fetch-jsqr.yml'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch jsQR 1.4.0
        run: |
          mkdir -p out
          curl -L --fail https://raw.githubusercontent.com/cozmo/jsQR/master/dist/jsQR.js -o out/jsQR.js
          grep -q 'root\["jsQR"\]' out/jsQR.js
          test "$(wc -c < out/jsQR.js)" -gt 100000
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jsqr-1.4.0
          path: out/jsQR.js
          if-no-files-found: error
